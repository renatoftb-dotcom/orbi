<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Guarda contra tela branca de deploy: depois de publicar uma versão nova,
      o navegador pode ficar com o index.html antigo, que aponta para um
      /assets/index-<hash>.js que não existe mais. A regra de SPA do Vercel
      devolve o próprio index.html nessa URL, o navegador tenta executar HTML
      como script e a tela fica em branco.
      Se o app não montar em 8 segundos, recarrega uma vez sem cache (a marca
      em sessionStorage impede laço infinito quando o erro for outro).
    -->
    <script>
      window.__vickeMontou = false;
      window.addEventListener("load", function () {
        setTimeout(function () {
          var raiz = document.getElementById("root");
          var vazio = !window.__vickeMontou && (!raiz || raiz.childElementCount === 0);
          if (!vazio) return;
          var jaTentou;
          try { jaTentou = sessionStorage.getItem("vicke-recarga-branca"); } catch (e) { jaTentou = "1"; }
          if (jaTentou) return;
          try { sessionStorage.setItem("vicke-recarga-branca", String(Date.now())); } catch (e) {}
          location.reload(true);
        }, 8000);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
